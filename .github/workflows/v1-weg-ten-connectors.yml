name: ChargeVisor V1 WEG ten-connector acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario_pause_seconds:
        description: 'Delay after individual WEG transitions: 0 = fast CI, 60 = paced endurance'
        type: choice
        default: '60'
        options:
          - '0'
          - '60'

permissions:
  contents: read

jobs:
  weg-ten-connectors:
    name: WEG - 10 connectors / 1 OCPP master / backend evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chargevisor_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chargevisor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CV_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chargevisor_ci
      CV_PUBLIC_URL: http://127.0.0.1:10000
      CV_ALLOW_CI_SEED: '1'
      CV_CI_ID: cvci000001
      CV_CI_PASSWORD: K7M4R8T2V9H3P6WA
      CV_BOOTSTRAP_EMAIL: ci@chargevisor.test
      CV_BOOTSTRAP_PASSWORD: ci-only-not-used-outside-disposable-db
      CV_SIM_WSS_BASE: ws://127.0.0.1:10000/ocpp
      CV_V1_STEP_PAUSE_SECONDS: ${{ inputs.scenario_pause_seconds || '0' }}
      PORT: '10000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check frozen current ChargeVisor frontend before backend testing
        run: node scripts/verify-frontend-unchanged.mjs
      - name: Install backend and independent OCPP client
        run: |
          npm ci --ignore-scripts
          python -m pip install -r requirements-ocpp-simulator.txt
      - name: Bootstrap disposable PostgreSQL
        run: CV_INIT_DB=1 node backend/setup.mjs
      - name: Generate disposable verifier token and tenant ID (never commit secrets)
        run: |
          TENANT="$(node -p 'require("node:crypto").randomUUID()')"
          TOKEN="$(node -p 'require("node:crypto").randomBytes(48).toString("base64url")')"
          HASH="$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(process.argv[1]).digest("hex"))' "$TOKEN")"
          echo "::add-mask::$TOKEN"
          echo "CV_OCPP_VERIFIER_TENANT_ID=$TENANT" >> "$GITHUB_ENV"
          echo "CV_OCPP_VERIFIER_SHA256=$HASH" >> "$GITHUB_ENV"
          echo "CV_VERIFIER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CV_VERIFIER_URL=http://127.0.0.1:10000" >> "$GITHUB_ENV"
      - name: Start real Node OCPP backend (only disposable CI)
        run: |
          node server.mjs >/tmp/chargevisor-v1-weg.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:10000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/chargevisor-v1-weg.log
          exit 1
      - name: Seed isolated simulated OCPP master and two initial connectors
        run: node scripts/seed-ocpp-ci.mjs
      - name: Extend SAME master to ten provisioned test connectors
        run: node scripts/v1-weg-seed-ci.mjs
      - name: Run independently implemented OCPP 1.6J over real WebSocket (ten connectors)
        run: python scripts/v1-weg-ten-connectors.py
      - name: Verify all ten transaction histories and faults in actual PostgreSQL
        run: node scripts/v1-weg-verify-ci.mjs
      - name: Show diagnostic server logs only if test fails
        if: failure()
        run: tail -n 150 /tmp/chargevisor-v1-weg.log || true
