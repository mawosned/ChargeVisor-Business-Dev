name: Backend regression guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-regression:
    name: backend-regression (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '26']
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies without postinstall side effects
        run: npm ci --ignore-scripts
      - name: Run all existing and new backend regressions
        run: npm test
