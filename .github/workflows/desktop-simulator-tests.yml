name: OCPP desktop simulator regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-python:
    name: simulator-python (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell update script before release
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/ocpp-chain-simulator/UPDATE-SIMULATOR.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Parse private release and rollback scripts without executing them
        shell: pwsh
        run: |
          foreach ($path in @('scripts/ops/prepare-private-release.ps1', 'scripts/ops/prepare-private-rollback.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/ocpp-chain-simulator/requirements.txt
      - name: Install independent OCPP dependencies
        run: python -m pip install -r tools/ocpp-chain-simulator/requirements.txt
      - name: Syntax-compile every simulator module
        run: python -m compileall -q tools/ocpp-chain-simulator
      - name: Run complete Python simulator tests, including evidence verifier
        working-directory: tools/ocpp-chain-simulator
        run: python -m unittest discover -s . -p 'test_*.py' -v
